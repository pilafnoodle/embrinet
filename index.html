<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embri</title>
<link rel="stylesheet" href="style.css">
</head>


<body>
<div id="fluid-simulator">

        <canvas id="canvas"></canvas>

        <div class="controls-container" id="controls-container">

            <div class="slider-set">
                <label class="slider-label" for="LastBrightnessCoeffSlider">Decay Coeff.</label>
                <input type="range" min="0.0" max="0.4" step ="0.01" value="0.2" class="slider" id="LastBrightnessCoeffSlider"> 
            </div>
            <div class="slider-set">
                <label class="slider-label" for="VertPropSlider">Vert. Propagation</label>
                <input type="range" min="0.05" max="0.7" step ="0.01" value="0.2" class="slider" id="VertPropSlider"> 
            </div>
            <div class="slider-set">
                <label class="slider-label" for="HorizPropSlider">Horiz. Propagation</label>
                <input type="range" min="0.05" max="0.4" step ="0.01" value="0.1" class="slider" id="HorizPropSlider">
            </div>
 
        </div>
</div>

        <div class="checkbox-container">
            <label for="show-controls-box">Open Simulator Controls</label>
                <input type="checkbox" id="show-controls-box">
        </div>    
        
        <button id="menu-button">
            <span>Δ </span> </button>

    <div id="text-content" class="text-content">
    <div id ="title">
        <h1>Embri.net</h1>
        <p>Cascade Memory</p>
        <button class="hyperlink" onclick="window.open('https://open.spotify.com/track/3TpSU2r6QYKCtt9K9WQTx8?si=35fda39a4a0049bf', '_blank')">Spotify</button>
        <button class="hyperlink" onclick="window.open('https://music.apple.com/de/album/chrysalis-single/1895492843', '_blank')">Apple Music</button>
        <button class="hyperlink" onclick="window.open('https://www.youtube.com/watch?v=RU8BxTnECmo', '_blank')">Youtube</button>
        <button class="hyperlink" onclick="window.open('https://embri.bandcamp.com/album/cascade-memory', '_blank')">Bandcamp</button>
    </div>

    <div id="footer">Thank you for visiting :D</div>
    </div>

    <script src="ripple.js"></script>

</body>
</html>
