<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embri</title>
<link rel="stylesheet" href="style.css">
</head>


<body>
<div id="desktop-nav">
    


</div>
<div id="fluid-simulator">
        <canvas id="canvas"></canvas>
        <div id="scroll-hint">
            <p class="caret">Continue ↓</p>
        </div>
<!-- 
        <div id="site-header">
            <h1>Embri.net</h1>
        </div> -->

</div>


<div id="home-page-content">
         
        <button id="menu-button">
            <span>⚙</span> </button>

        <div class="controls-container" id="controls-container">
            <div class="slider-set">
                <label class="slider-label" for="LastBrightnessCoeffSlider">Decay Coeff.</label>
                <input type="range" min="0.001" max="0.99" step ="0.01" value="0.3" class="slider" id="LastBrightnessCoeffSlider"> 
            </div>
            <div class="slider-set">
                <label class="slider-label" for="VertPropSlider">Vert. Propagation</label>
                <input type="range" min="0.1" max="0.99" step ="0.01" value="0.32" class="slider" id="VertPropSlider"> 
            </div>
            <div class="slider-set">
                <label class="slider-label" for="HorizPropSlider">Horiz. Propagation</label>
                <input type="range" min="0.1" max="0.99" step ="0.01" value="0.4" class="slider" id="HorizPropSlider">
            </div>

        </div>

            
        <div class="checkbox-container">
            <label for="show-controls-box">open fluid controls</label>
                <input type="checkbox" id="show-controls-box">
        </div>   

    <div id="text-content" class="text-content">
        <div id ="title">
            <!-- <h1>Embri.net</h1> -->
            <img id="cover-art" src="img/low_res_cover.avif">
            <!-- <h1>Embri</h1>
            <h1>
                Cascade Memory</h1> -->
            <div>
                <button class="hyperlink" onclick="window.open('https://open.spotify.com/album/0QDOc9BeFWXSoxmocdQ666?si=EdB_AKZLSC-0tPtfEC7yOQ', '_blank')">Spotify</button>
                <button class="hyperlink" onclick="window.open('https://music.apple.com/us/album/cascade-memory/1896178466', '_blank')">Apple Music</button>
                <button class="hyperlink" onclick="window.open('https://www.youtube.com/watch?v=RU8BxTnECmo', '_blank')">Youtube</button>
                <button class="hyperlink" onclick="window.open('https://embri.bandcamp.com/album/cascade-memory', '_blank')">Bandcamp</button>
    
                <button class="hyperlink" onclick="window.open('https://www.instagram.com/embri_net/', '_blank')">Instagram</button>
            </div>
        </div>





        


        <div id="footer">Thank you for visiting :D</div>
    </div>
    </div>


    <script src="ripple.js"></script>

</body>
</html>
